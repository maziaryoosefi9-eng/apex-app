<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fafaf9;--card:#ffffff;--tx:#232323;--mut:#8a8984;--bd:#ececea;--ac:#5b7cfa;--ok:#2f9e63;--bad:#d64545;--lk:#a9a7a0}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161618;--card:#1d1d20;--tx:#ececea;--mut:#8b8a92;--bd:#2a2a2f;--ac:#7f97ff;--ok:#49c083;--bad:#ef6a6a;--lk:#62616a}}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:13px system-ui,-apple-system,Segoe UI,sans-serif;display:flex;flex-direction:column}
header{display:flex;gap:2px;align-items:center;justify-content:flex-start;padding:2px 6px;background:var(--card);border-bottom:1px solid var(--bd);position:relative;z-index:25}header button{padding:3px 10px;border-radius:6px}header button.open{background:var(--bg)}#fm{display:none;position:absolute;left:0;top:100%;margin-top:3px;min-width:200px;flex-direction:column;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:4px;box-shadow:0 6px 18px #0003;z-index:40}#fm button{width:100%;justify-content:flex-start;gap:8px;padding:6px 10px;border-radius:6px;text-align:left}
input,select,button,textarea{font:inherit;color:var(--tx);background:transparent;border:1px solid transparent;border-radius:8px;padding:5px 9px}input,select,textarea{background:var(--bg);border-color:var(--bd)}input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac)}
button{cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:4px}button svg{display:block}
button:hover:not(:disabled){background:var(--bg)}button:disabled{opacity:.4;cursor:default}
button.on{background:var(--bad);color:#fff;border-color:var(--bad)}
.m{color:var(--mut)}
#main{flex:1;display:flex;min-height:0}
#tbl{width:240px;border-right:1px solid var(--bd);background:var(--card);flex:none;display:flex;flex-direction:column;position:relative}
.th{height:52px;box-sizing:border-box;padding:0 10px;display:flex;align-items:center;gap:8px;font-weight:600;color:var(--mut);border-bottom:1px solid var(--bd)}
.th button,.fl{padding:3px 5px}
.tw{flex:1;overflow:auto}
.r{height:38px;box-sizing:border-box;display:flex;align-items:center;gap:8px;padding:0 12px;cursor:default}.r:hover{background:var(--bg)}.r.sel{background:var(--bg);box-shadow:inset 2px 0 var(--ac)}.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}.dot.b{background:var(--bad)}.dt{font-size:11px;white-space:nowrap}.nm[readonly]{cursor:default;user-select:none}.nm:not([readonly]){background:var(--bg)!important;border:1px solid var(--ac)!important;border-radius:6px}
.r .nm{flex:1;min-width:0;border:0;background:transparent;padding:2px}
.x{border:0!important;background:transparent!important;color:var(--mut);padding:0 4px!important}
.lb{display:flex;gap:4px;padding:6px;border-top:1px solid var(--bd)}.lb button{flex:1;padding:6px 2px;flex-direction:column;gap:2px;font-size:11px;position:relative;min-width:0}.lb button svg{width:15px;height:15px}.lb button i{position:absolute;top:1px;right:5px;font-style:normal;font-size:10px;color:var(--mut)}.lb .o{border-color:var(--ac);color:var(--ac)}
.li{display:flex;align-items:center;gap:6px;padding:7px 10px;border-bottom:1px solid var(--bd);cursor:grab}.li span:first-child{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#cv{flex:1;position:relative;overflow:hidden;min-width:0}
.fl{position:absolute;top:13px;z-index:4;display:none}
svg.cvs{width:100%;height:100%;display:block;touch-action:none;user-select:none}
svg.cvs text{fill:var(--tx);font-size:12px;pointer-events:none}svg.cvs .m{fill:var(--mut);font-size:11px}svg.cvs line{pointer-events:none}
.nd{fill:var(--ac)}.nd.w{fill:var(--bad)}.nd.l{fill:var(--ac);fill-opacity:.55}.pg{fill:#000;opacity:.22}svg.cvs text.w{fill:#fff}svg.cvs text.k{fill:#2b2300}
.ed{position:absolute;z-index:3}
#pp{width:290px;border-left:1px solid var(--bd);background:var(--card);flex:none;display:flex;flex-direction:column;overflow:auto}
.ph{height:52px;box-sizing:border-box;flex:none;padding:0 10px;display:flex;align-items:center;gap:8px;font-weight:600;color:var(--mut);border-bottom:1px solid var(--bd)}
.pb{padding:12px;display:flex;flex-direction:column;gap:8px}
.pb label{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--mut)}
.pb input,.pb select,.pb textarea{width:100%;box-sizing:border-box}
.sec{font-size:11px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;margin-top:6px}
.rw{display:flex;gap:6px;align-items:center}
#clock{font:600 17px ui-monospace,monospace;flex:1}
#tip{position:fixed;z-index:20;pointer-events:none;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;box-shadow:0 4px 14px #0003;font-size:12px;max-width:260px;display:none;line-height:1.5}
#nav{position:absolute;left:50%;transform:translateX(-50%);bottom:14px;z-index:4;display:flex;gap:2px;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:3px;box-shadow:0 4px 14px #0002}
#nav select{background:transparent;border-color:transparent;padding:5px 6px;cursor:pointer}#nav select:hover{background:var(--bg)}
#pp.ib .cvo{display:none}

#tbl{width:200px}
#nv{flex:1;display:flex;flex-direction:column;gap:2px;padding:8px}
#nv button{width:100%;justify-content:flex-start;gap:10px;padding:8px 10px;font-size:13px}
#nv button.o{background:var(--bg);color:var(--ac);box-shadow:inset 2px 0 var(--ac)}
#nv button i{margin-left:auto;font-style:normal;font-size:11px;color:var(--mut)}
.sp{flex:1}
button.ok{background:var(--ok);color:#fff;border-color:var(--ok)}button.ok:hover:not(:disabled){background:var(--ok)}
.nd.d{fill:var(--ok)}
.page{display:none;flex:1;min-width:0;min-height:0;overflow:auto}
#main[data-pg="mn"] #pgM,#main[data-pg="tr"] #pgT{display:block}#main[data-pg="hb"] #pgH{display:block}
#main:not([data-pg="tl"]) #cv,#main:not([data-pg="tl"]) #pp{display:none!important}
.pgi{max-width:1080px;margin:0 auto;padding:18px;display:flex;flex-direction:column;gap:14px;box-sizing:border-box}
.pgh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.pgh h2{margin:0;font-size:20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}
.ch{display:flex;align-items:center;gap:8px;font-weight:600;margin-bottom:8px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.big{font-size:21px;font-weight:700;margin-top:4px}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:8px;overflow:hidden}.seg button{border-radius:0;padding:4px 12px}
.seg button.sel{background:var(--ac);color:#fff}.seg .out.sel{background:var(--bad)}.seg .in.sel{background:var(--ok)}
.frm{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.frm input{min-width:0}
.two{display:grid;grid-template-columns:minmax(280px,2fr) 3fr;gap:14px;align-items:start}
@media(max-width:820px){.two{grid-template-columns:1fr}}
.tr2{display:flex;align-items:center;gap:6px;padding:8px 4px;border-bottom:1px solid var(--bd)}.tr2:last-child{border:0}
.td1{flex:1;min-width:0}.nt{overflow:hidden;text-overflow:ellipsis}.sub{font-size:11px;margin-top:2px;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.am{font-weight:600;white-space:nowrap}.am.in{color:var(--ok)}.am.out{color:var(--bad)}

/* ================= Sync with a private GitHub repo (offline-first, merge per item) ================= */
const DEV=(()=>{let d=+localStorage.getItem('planner5_dev');if(!d){d=1+Math.floor(Math.random()*999);try{localStorage.setItem('planner5_dev',d)}catch(e){}}return d})(),uid=n=>n*1000+DEV;
const SC=()=>{try{return JSON.parse(localStorage.getItem('planner5_sync'))||{}}catch(e){return{}}},COLS=['tasks','habits','ses','money'],SY={busy:0,st:'off',msg:''};
const kf=(c,it)=>c==='ses'?it.h+':'+it.ts+':'+it.ms:it.id,canon=v=>JSON.stringify(v,(k,x)=>x&&typeof x==='object'&&!Array.isArray(x)?Object.fromEntries(Object.entries(x).sort(([a],[b])=>a<b?-1:1)):x);
function cols(){const o={tasks:{},habits:{},ses:{},money:{}};for(const t of S.tasks)o.tasks[t.id]=t;for(const h of S.habits){o.habits[h.id]=h;for(const x of h.sessions)o.ses[h.id+':'+x.ts+':'+x.ms]=x}for(const e of(S.money&&S.money.items)||[])o.money[e.id]=e;return o}
const hj=(c,it)=>{const n=Date.now();return JSON.stringify(it,(k,v)=>k==='u'||k==='sessions'||k[0]==='_'?undefined:(c==='tasks'&&k==='start'&&it.st==='cv'&&!it.lk&&v<=n?0:v))};
function stamp(){S.sn=S.sn||{};S.tomb=S.tomb||{};const now=Date.now(),cs=cols();
 for(const c of COLS){const sn=S.sn[c]=S.sn[c]||{},tb=S.tomb[c]=S.tomb[c]||{},cur=cs[c];
  for(const k in cur){const it=cur[k],j=hj(c,it);if(sn[k]!==j||!it.u){it.u=now;sn[k]=j;delete tb[k]}}
  for(const k in sn)if(!(k in cur)){tb[k]=now;delete sn[k]}
  for(const k in tb)if(now-tb[k]>180*DAY)delete tb[k]}}
function rebuildSn(){const cs=cols();S.sn={};for(const c of COLS){S.sn[c]={};for(const k in cs[c])S.sn[c][k]=hj(c,cs[c][k])}}
function toDoc(){stamp();const cs=cols(),d={v:1,tomb:JSON.parse(JSON.stringify(S.tomb))};
 for(const c of COLS)d[c]=Object.keys(cs[c]).sort().map(k=>{const it=cs[c][k],o={};for(const f in it)if(f[0]!=='_'&&f!=='sessions')o[f]=it[f];if(c==='ses')o.h=+k.split(':')[0];return o});return d}
function merge(L,R){const M={v:1,tomb:{}},now=Date.now();
 for(const c of COLS){const a={},b={},tl=(L.tomb&&L.tomb[c])||{},tr=(R.tomb&&R.tomb[c])||{},out={},tm={};
  for(const it of L[c])a[kf(c,it)]=it;for(const it of R[c]||[])b[kf(c,it)]=it;
  for(const k of new Set([...Object.keys(a),...Object.keys(b),...Object.keys(tl),...Object.keys(tr)])){
   const x=a[k],y=b[k],tt=Math.max(tl[k]||0,tr[k]||0),ux=x?x.u||0:-1,uy=y?y.u||0:-1,best=uy>=ux?y:x;
   if(best&&Math.max(ux,uy)>=tt)out[k]=best;else if(tt&&now-tt<180*DAY)tm[k]=tt}
  M[c]=Object.keys(out).sort().map(k=>out[k]);M.tomb[c]=Object.fromEntries(Object.entries(tm).sort(([p],[q])=>p<q?-1:1))}return M}
function apply(M){const old={t:S.tasks,h:S.habits,m:S.money.items},ord=(arr,o)=>{const p=new Map(o.map((x,i)=>[x.id,i]));return arr.sort((a,b)=>(p.has(a.id)?p.get(a.id):1e9)-(p.has(b.id)?p.get(b.id):1e9))},hs=new Map(M.habits.map(h=>[h.id,{...h,sessions:[]}]));
 for(const x of M.ses){const h=hs.get(x.h);if(h){const r={...x};delete r.h;h.sessions.push(r)}}
 for(const h of hs.values())h.sessions.sort((a,b)=>a.ts-b.ts);
 S.tasks=ord(M.tasks.map(t=>({...t})),old.t);S.habits=ord([...hs.values()],old.h);S.money.items=ord(M.money.map(e=>({...e})),old.m);S.tomb=JSON.parse(JSON.stringify(M.tomb));rebuildSn();
 if(T&&!hab(T.id)){T=null;V.ht=null}if(sel&&!get(sel))sel=null;MS=MS.filter(i=>get(i));ppSig='';caps();settle();tb();render();if(PG==='mn')renderMoney();else if(PG==='hb')renderHabits();persist()}
const b64=x=>btoa(unescape(encodeURIComponent(x))),ub64=x=>decodeURIComponent(escape(atob(x.replace(/\s/g,''))));
const gh=(c,m,body)=>fetch('https://api.github.com/repos/'+c.repo+'/contents/'+(c.path||'data.json'),{method:m,cache:'no-store',headers:{Authorization:'Bearer '+c.token,Accept:'application/vnd.github+json'},body:body&&JSON.stringify(body)});
function setSt(k,m){SY.st=k;SY.msg=m||'';const b=$('syb');if(!b)return;b.innerHTML=ic('refresh')+'<span>'+{off:'Sync: off',syncing:'Syncing…',offline:'Offline',err:'Sync error',ok:'Synced '+new Date().toTimeString().slice(0,5)}[k]+'</span>';b.title=m||'';b.style.color=k==='err'?'var(--bad)':k==='ok'?'var(--ok)':'var(--mut)'}
function schedSync(){if(!SC().repo)return;clearTimeout(SY.d);SY.d=setTimeout(sync,3000)}
async function sync(){const c=SC();if(!c.repo||!c.token){setSt('off');return}if(SY.busy)return;if(!navigator.onLine){setSt('offline');return}
 const ae=document.activeElement;if(ae&&/INPUT|TEXTAREA/.test(ae.tagName)&&!ae.readOnly){clearTimeout(SY.d);SY.d=setTimeout(sync,4000);return}
 SY.busy=1;setSt('syncing');
 try{for(let i=0;i<3;i++){const g=await gh(c,'GET');let R={v:1,tomb:{}},sha;
   if(g.status===200){const j=await g.json();sha=j.sha;try{R=JSON.parse(ub64(j.content))}catch(e){throw Error('data.json is not valid JSON')}}else if(g.status!==404)throw Error(g.status===401?'Token rejected (401)':'GitHub error '+g.status);
   const L=toDoc(),M=merge(L,R),cm=canon(M);if(cm!==canon(L))apply(M);
   if(cm===canon(R)){setSt('ok');return}
   const p=await gh(c,'PUT',{message:'sync '+new Date().toISOString(),content:b64(JSON.stringify(M)),sha});
   if(p.ok){setSt('ok');return}if(p.status===409||p.status===422)continue;
   throw Error(p.status===404?'Repo not found or token has no access':p.status===401||p.status===403?'Token has no write access (Contents: read & write)':'GitHub error '+p.status)}
  throw Error('Conflict, will retry')}
 catch(e){setSt(e instanceof TypeError?'offline':'err',e.message)}finally{SY.busy=0}}
function syncDlg(){const c=SC(),o=document.createElement('div');o.style.cssText='position:fixed;inset:0;background:#0006;z-index:60;display:flex;align-items:center;justify-content:center';
 o.innerHTML=`<div style="background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;width:min(440px,92vw);display:flex;flex-direction:column;gap:10px"><b>Sync with GitHub</b><div class="m" style="font-size:12px;line-height:1.5">A private data repo, and a fine-grained token limited to that repo (Contents: read &amp; write).</div><input id="sr" placeholder="username/apex-data" value="${esc(c.repo||'')}"><input id="stk" type="password" placeholder="Token (github_pat_…)" value="${esc(c.token||'')}"><div id="sms" class="m" style="font-size:12px;min-height:16px">${esc(SY.msg)}</div><div class="rw"><button id="sdis">Disconnect</button><span class="sp"></span><button id="scl">Close</button><button id="sgo" class="ok">Save &amp; sync</button></div></div>`;
 document.body.appendChild(o);const q=i=>o.querySelector(i);q('#scl').onclick=()=>o.remove();
 q('#sdis').onclick=()=>{localStorage.removeItem('planner5_sync');setSt('off');o.remove()};
 q('#sgo').onclick=async()=>{const repo=q('#sr').value.trim().replace(/^https?:\/\/github\.com\//,'').replace(/\/$/,''),token=q('#stk').value.trim();if(!/^[\w.-]+\/[\w.-]+$/.test(repo)||!token){q('#sms').textContent='Enter the repo as username/name and the token.';return}
  localStorage.setItem('planner5_sync',JSON.stringify({repo,token}));q('#sms').textContent='Syncing…';await sync();q('#sms').textContent=SY.st==='ok'?'Done.':SY.msg||'';if(SY.st==='ok')setTimeout(()=>o.remove(),600)}}
addEventListener('online',sync);document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});setInterval(()=>{if(!document.hidden)sync()},60000);
